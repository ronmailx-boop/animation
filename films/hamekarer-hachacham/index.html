<!doctype html>
<html lang="he" dir="rtl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>/* #preview: silent looping highlight for the gallery card; #embed: player inside the gallery */
(function(){const m=location.hash.slice(1);if(m==='preview'||m==='embed')document.documentElement.classList.add(m);})();</script>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
html.preview body{padding:0;background:#000;overflow:hidden}
html.preview .head,html.preview .ctl,html.preview #status,html.preview .title,html.preview .bigplay{display:none!important}
html.preview .wrap{max-width:none;gap:0}
html.preview .stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none;cursor:default}
html.embed .head{display:none}
html.embed body{padding-block:8px}
/* layout: phone-shaped stage (a dark kitchen at 2 a.m.), slim controls underneath */
:root{
  --bg:#eef0f7; --fg:#161a2e; --muted:#5d6380; --accent:#2f9e8f; --panel:#ffffff; --line:#d3d7e6;
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e1020; --fg:#e9ecfb; --muted:#9aa1c4; --accent:#5fd3c3; --panel:#1a1d33; --line:#2c3150; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1020; --fg:#e9ecfb; --muted:#9aa1c4; --accent:#5fd3c3; --panel:#1a1d33; --line:#2c3150; color-scheme:dark}

body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.head{width:100%}
h1{font:400 26px/1.1 var(--font-display);margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}

.stage{
  position:relative; aspect-ratio:9/16; width:min(100%, max(220px, calc((100svh - 210px) * .5625)));
  border-radius:16px; overflow:hidden; background:#1b2140; container-type:inline-size;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 0 0 1px var(--line);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}
.title{inset:0;background:#121628;color:#7ff0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;text-align:center;padding:8cqw}
.title small{font:800 4.4cqw var(--font-body);color:#aab3e0}
.title h2{font:400 18cqw/1 var(--font-display);margin:0}
.title p{margin:0;font:500 5cqw var(--font-body);color:#e9ecfb}
.end{left:10cqw;right:10cqw;bottom:6cqw;background:rgba(18,22,40,.95);color:#e9ecfb;border-radius:4cqw;padding:3.4cqw;text-align:center;opacity:0}
.end .fin{font:400 14cqw/1 var(--font-display);color:#7ff0e0}
.end small{display:block;margin-top:1.2cqw;font:500 3.6cqw/1.4 var(--font-body);color:#c9cfee}
.bigplay{left:50%;top:50%;width:22cqw;height:22cqw;margin:-11cqw 0 0 -11cqw;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1cqw 4cqw rgba(0,0,0,.35)}
.bigplay svg{position:static;width:10cqw;height:10cqw}

.ctl{width:100%;max-width:min(100%, 420px);display:flex;align-items:center;gap:10px;direction:ltr}
.ctl button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctl button:focus-visible,.ctl input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:44px;margin:0}
#time{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:34px;text-align:center}
#status{margin:0;color:var(--muted);font-size:13px;line-height:1.4;text-align:center}
</style>
</head>

<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const eo=u=>1-Math.pow(1-u,3);
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const win=(t,a,b,f)=>seg(t,a,a+(f||.25))*(1-seg(t,b-(f||.25),b)); // 0→1→0 over [a,b]
const A=(el,k,v)=>el.setAttribute(k,v);
const DUR=30, AVI=0, FRIDGE=1, MOM=2;

/* ---------- script: who says what, when (s = start, d = clip length) ---------- */
const LINES=[
 {c:FRIDGE,f:'01',s:1.3, d:4.68}, // good night, Avi. It's 2:15. What are we looking for?
 {c:AVI,   f:'02',s:5.7, d:2.04}, // just... water
 {c:FRIDGE,f:'03',s:7.4, d:4.68}, // the water's in the door. The cake's on the top shelf. Just saying.
 {c:AVI,   f:'04',s:11.9,d:2.51}, // okay... just one bite
 {c:FRIDGE,f:'05',s:14.4,d:2.51}, // alert! suspected snacking!
 {c:MOM,   f:'06',s:17.2,d:4.05}, // Avi! what are you doing up at 2 a.m. next to my cake?!
 {c:AVI,   f:'07',s:20.85,d:1.8}, // Mom?! how did you...
 {c:FRIDGE,f:'08',s:22.2,d:2.69}, // I'm in the family WhatsApp group
 {c:MOM,   f:'09',s:24.5,d:4.6}   // ...and there's schnitzel in the freezer. Heat it up, don't eat it cold.
];
const ENV_FPS=60;
function envOf(buf){ // loudness per 1/60 s (33 ms window), scaled so speech peaks open the mouth fully
  const ch=buf.getChannelData(0),hop=Math.max(1,Math.round(buf.sampleRate/ENV_FPS)),n=Math.ceil(ch.length/hop),e=new Float32Array(n);
  let pk=1e-6;
  for(let i=0;i<n;i++){
    const a=i*hop,b=Math.min(ch.length,a+hop*2);let s=0;
    for(let j=a;j<b;j++) s+=ch[j]*ch[j];
    e[i]=Math.sqrt(s/Math.max(1,b-a));if(e[i]>pk) pk=e[i];
  }
  for(let i=0;i<n;i++) e[i]=Math.min(1,e[i]/(pk*.7));
  return e;
}
function mouthOf(c,t){
  let m=0;
  for(const l of LINES){
    if(l.c!==c||!l.env||t<l.s||t>=l.s+l.d) continue;
    m=Math.max(m,l.env[Math.floor((t-l.s)*ENV_FPS)]||0);
  }
  return m;
}

/* ---------- Avi's face over time ---------- */
const MOOD=[
 [0,    {es:.8, bu:-1,ba:2, sm:3, o:0}],   // tiptoeing
 [1.35, {es:1.45,bu:6,ba:-1,sm:0, o:.35}], // the fridge talks
 [2.3,  {es:1.1,bu:3, ba:-2,sm:-2,o:0}],   // nervous
 [9.2,  {es:.7, bu:0, ba:3, sm:6, o:0}],   // ...cake, you say?
 [14.4, {es:1.6,bu:7, ba:-1,sm:0, o:.5}],  // ALERT
 [16.4, {es:1.2,bu:4, ba:-3,sm:-5,o:0}],   // the phone rings
 [20.8, {es:1.4,bu:5, ba:-2,sm:-2,o:0}],   // Mom?!
 [22.3, {es:.5, bu:-2,ba:0, sm:0, o:0}],   // slowly turns to the fridge
 [25.7, {es:1.05,bu:3,ba:-3,sm:4, o:0}],   // ...schnitzel?
 [28.9, {es:.55,bu:-2,ba:0, sm:1, o:0}]    // look to camera
];
const MK=['es','bu','ba','sm','o'];
function moodAt(t){
  let k=0; for(let j=0;j<MOOD.length;j++) if(t>=MOOD[j][0]) k=j;
  const cur=MOOD[k][1],prev=MOOD[Math.max(0,k-1)][1],u=eio(seg(t,MOOD[k][0],MOOD[k][0]+.3));
  const r={}; MK.forEach(q=>r[q]=lerp(prev[q],cur[q],u)); return r;
}
function aviX(t){ return lerp(-70,86,eio(seg(t,0,1.3)))+(t>=11.9&&t<14.4?10*eio(seg(t,12.6,13.6)):0); }
const AY=350;
function lookTarget(t){
  const SCR=[240,180],CAKE=[248,318],CALL=[100,150],PH=[36,406],FRZ=[240,200];
  if(t<1.3) return [300,330];
  if(t<9.2) return SCR;
  if(t<14.4) return CAKE;
  if(t<16.4) return SCR;
  if(t<17.2) return PH;
  if(t<22.3) return CALL;
  if(t<24.5) return SCR;
  if(t<28.1) return CALL;
  if(t<28.9) return FRZ;
  return null;
}
function look(t){
  let x=0,y=0;
  for(const dt of [0,.07,.14,.21]){
    const p=lookTarget(Math.max(0,t-dt)); if(!p) continue;
    const dx=p[0]-aviX(t),dy=p[1]-(AY+20),d=Math.hypot(dx,dy);
    if(d>1){x+=dx/d;y+=dy/d;}
  }
  return [x/4,y/4];
}
const blinkOf=(t,ph)=>Math.max(0,1-Math.abs((((t+ph)%3.4)-3.3)/.07));

/* ---------- elements ---------- */
const E={};

const BARS=[];
for(let i=0;i<5;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');A(r,'x',224+i*8);A(r,'width',5);A(r,'rx',2);E.fBars.append(r);BARS.push(r);}

/* ---------- render: everything is a pure function of t ---------- */
function render(t){
  const alarm=t>=14.4&&t<16.6;
  const shake=(alarm?2.2*(1-seg(t,14.4,16.6)):0)+(t>=17.2&&t<17.6?2:0);
  A(E.cam,'transform',`translate(${Math.sin(t*61)*shake} ${Math.cos(t*53)*shake})`);

  // fridge doors
  const open=eo(seg(t,1.0,1.3));

  const fz=eo(seg(t,28.0,28.35));

  const fm=mouthOf(FRIDGE,t);
  const on=t>=1.25;
  A(E.face,'opacity',on?1:0);
  const boot=win(t,1.25,1.55,.15);

  A(E.scrFlash,'opacity',alarm?(Math.floor(t*6)%2?.85:.2):boot*.6);
  const happy=t>=22.2&&t<24.9;
  const col=alarm?'#ffffff':'#6ee7ff';
  let eh=20;
  if(t>=7.4&&t<11.6) eh=9;              // unimpressed
  if(t>=17.2&&t<22.2) eh=13;            // smug
  if(alarm) eh=22;
  eh*=1-.9*blinkOf(t,.7);
  [E.feL,E.feR].forEach(e=>{A(e,'height',Math.max(2,eh));A(e,'y',184-eh);A(e,'fill',col);A(e,'opacity',happy?0:1);});
  [E.fhL,E.fhR].forEach(e=>A(e,'opacity',happy?1:0));
  BARS.forEach((r,i)=>{const h=2+fm*16*[.55,.85,1,.85,.55][i]*(.8+.2*Math.sin(t*23+i*1.7));A(r,'height',h);A(r,'y',203-h/2);A(r,'fill',col);});

  // cake: sparkles when mentioned, lasers in the alarm
  A(E.cakeGlow,'opacity',win(t,9.3,14.3,.3)*(.6+.4*Math.sin(t*9)));
  A(E.laser,'opacity',t>=14.5&&t<24.5?(.7+.3*Math.sin(t*20)):0);
  A(E.beacon,'opacity',alarm?1:0);
  A(E.beam,'r',16+8*Math.abs(Math.sin(t*9)));
  A(E.siren,'opacity',alarm?(Math.floor(t*4)%2?.18:.04):0);

  // family chat notification
  const ch=win(t,22.3,25.3,.3);
  A(E.chat,'opacity',ch);A(E.chat,'transform',`translate(0 ${(1-ch)*12+Math.sin(t*4)*2})`);

  // phone: rings on the counter, then goes to Avi's ear
  const ring=t>=16.4&&t<17.05;
  A(E.phGlow,'opacity',ring?(.5+.5*Math.sin(t*30)):0);
  A(E.phoneC,'transform',ring?`translate(${Math.sin(t*90)*1.6} 0)`:'');
  A(E.phoneC,'opacity',t>=17.05?0:1);
  const inCall=t>=17.05&&t<29.0;

  // Avi
  const ax=aviX(t), hop=t<1.3?Math.abs(Math.sin(t*9))*4:0;
  const jump=t>=14.4&&t<15.0?-26*Math.sin(seg(t,14.4,15.0)*Math.PI):0;
  A(E.avi,'transform',`translate(${ax} ${AY-hop+jump})`);
  // arms: shoulders at (±28, 70) in Avi's space
  const surrender=win(t,14.45,16.4,.15);
  const fork=t>=11.6&&t<16.4;
  let rx=34,ry=120;                                         // right hand at rest
  if(t<2.4){rx=lerp(34,22,win(t,1.35,2.4,.2));ry=lerp(120,60,win(t,1.35,2.4,.2));}   // startled, hand to chest
  if(t>=5.7&&t<7.6){const w=win(t,5.7,7.6,.2);rx=lerp(34,10,w);ry=lerp(120,38,w);}  // whisper behind hand
  if(fork){
    const up=eo(seg(t,11.6,11.9)),reachU=eio(seg(t,13.2,14.2));
    rx=lerp(lerp(34,40,up),248-ax-4,reachU);ry=lerp(lerp(120,64,up),318-AY-6,reachU);
  }
  rx=lerp(rx,46,surrender);ry=lerp(ry,-34,surrender);
  let lx=-34,ly=120;
  lx=lerp(lx,-46,surrender);ly=lerp(ly,-34,surrender);
  if(inCall){const p=eio(seg(t,17.05,17.4));lx=lerp(-34,-36,p);ly=lerp(120,28,p);}
  A(E.handR,'cx',rx);A(E.handR,'cy',ry);A(E.handL,'cx',lx);A(E.handL,'cy',ly);
  A(E.armR,'d',`M24,72 Q${lerp(24,rx,.5)+8},${Math.max(72,ry)+10} ${rx},${ry}`);
  A(E.armL,'d',`M-24,72 Q${lerp(-24,lx,.5)-8},${Math.max(72,ly)+10} ${lx},${ly}`);
  A(E.fork,'opacity',fork?1:0);
  A(E.fork,'transform',`translate(${rx} ${ry}) rotate(${fork&&t>=13.2?50:15})`);
  A(E.phoneH,'opacity',inCall?1:0);A(E.phoneH,'transform',`translate(${lx-2} ${ly-4}) rotate(-10)`);
  // head + face
  const m=moodAt(t),L=look(t),talk=mouthOf(AVI,t);
  const camLook=t>=28.9;
  const tilt=Math.sin(t*1.4)*2+(t>=22.3&&t<24.5?8*eio(seg(t,22.3,23.2)):0)+(camLook?-4:0);
  A(E.aHead,'transform',`translate(0 ${20-talk*1.2}) rotate(${tilt})`);
  A(E.hair,'transform',`translate(0 ${t>=14.4&&t<16.4?-6:0}) scale(1 ${t>=14.4&&t<16.4?1.25:1})`);
  const ery=Math.max(.7,8*m.es*(1-.92*blinkOf(t,0)));
  A(E.aeL,'ry',ery);A(E.aeR,'ry',ery);
  const px=camLook?0:L[0]*2.8,py=camLook?0:L[1]*2.6,pr=m.es>1.3?2.5:3.4;
  [[E.apL,-12],[E.apR,12]].forEach(([e,x])=>{A(e,'cx',x+px);A(e,'cy',-1+py);A(e,'r',pr);});
  const by=-13-m.bu;
  A(E.abL,'d',`M-19,${by} L-5,${by+m.ba}`);A(E.abR,'d',`M5,${by+m.ba} L19,${by}`);
  const o=Math.max(talk,m.o);
  if(o>.12){A(E.amo,'opacity',1);A(E.amo,'rx',5+3.5*o);A(E.amo,'ry',1.5+7*o);A(E.asm,'opacity',0);}
  else{A(E.amo,'opacity',0);A(E.asm,'opacity',1);A(E.asm,'d',`M-9,19 Q0,${19+m.sm*1.4} 9,19`);}

  // Mom's video call
  const pop=eo(seg(t,17.1,17.35))*(1-eio(seg(t,28.95,29.2)));
  const angry=t<24.5, mt=mouthOf(MOM,t);
  const msh=angry&&mt>.3?Math.sin(t*40)*2*mt:0;
  A(E.call,'opacity',pop>0?1:0);
  A(E.call,'transform',`translate(${100+msh} 150) scale(${pop})`);
  A(E.mHead,'transform',`rotate(${Math.sin(t*1.8)*3}) translate(0 ${-mt*1.2})`);
  const mes=angry?(mt>.2?1.25:1.1):.85, mry=7.5*mes*(1-.92*blinkOf(t,1.9));
  A(E.meL,'ry',mry);A(E.meR,'ry',mry);
  const mlx=t<24.5?1.6:1.2;
  [[E.mpL,-13],[E.mpR,13]].forEach(([e,x])=>{A(e,'cx',x+mlx);A(e,'cy',5);});
  const mbu=angry?-1:3,mba=angry?5:-3,mb=-8-mbu;
  A(E.mbL,'d',`M-20,${mb} L-6,${mb+mba}`);A(E.mbR,'d',`M6,${mb+mba} L20,${mb}`);
  if(mt>.12){A(E.mmo,'opacity',1);A(E.mmo,'rx',5+4*mt);A(E.mmo,'ry',1.5+7*mt);A(E.msm,'opacity',0);}
  else{A(E.mmo,'opacity',0);A(E.msm,'opacity',1);A(E.msm,'d',`M-9,28 Q0,${28+(angry?-5:6)} 9,28`);}
  A(E.rec,'opacity',Math.floor(t*2)%2?.3:1);

  E.end.style.opacity=eo(seg(t,29.35,29.75));
  E.title.style.opacity=(t<.05&&!playing)?1:0;
  E.seek.value=t;
  E.time.textContent='0:'+String(Math.floor(t)).padStart(2,'0');
}

/* ---------- audio: Web Audio for voices and the synthesized effects ---------- */
let AC=null,master=null,noiseBuf=null,muted=false,loaded=0,failed=0;
const live=new Set();
function ctx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;if(!C) return null;
  try{AC=new C();}catch(e){return null;}
  master=AC.createGain();master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return AC;
}
function ac(){ // from a tap: wake the context, and on iPhone play even with the silent switch on
  try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
  if(!ctx()) return null;
  if(AC.state==='suspended') AC.resume();
  const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
  return AC;
}
function track(s){live.add(s);s.onended=()=>live.delete(s);return s;}
function stopAll(){live.forEach(s=>{try{s.stop();}catch(e){}});live.clear();}
function playBuf(buf,off,vol){
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=buf;g.gain.value=vol||1;s.connect(g);g.connect(master);s.start(0,off||0);track(s);
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);track(o);
}
function swell(f,dur,vol,delay){ // soft attack, for the choir
  if(!AC) return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.35);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);track(o);
}
function noise(dur,vol,freq,delay){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.5);s.stop(t0+dur+.02);track(s);
}
const SFX=[
  ...[.15,.45,.75,1.05].map(x=>[x,()=>tone(700,500,.05,'sine',.06)]),             // tiptoe
  [1.0,()=>{noise(.18,.2,500);tone(90,60,.3,'sine',.12);}],                       // door opens
  [1.26,()=>{tone(880,880,.12,'sine',.08);tone(1320,1320,.2,'sine',.07,.12);}],   // screen wakes
  [9.35,()=>tone(1800,2400,.25,'sine',.05)],                                      // cake sparkle
  [11.65,()=>tone(3200,3000,.35,'sine',.07)],                                     // ting! the fork
  ...[0,1,2,3,4,5,6,7].map(k=>[14.4+k*.26,()=>tone(k%2?620:880,k%2?620:880,.24,'square',.045)]), // siren
  [16.45,()=>{tone(1300,1300,.12,'square',.04);tone(1600,1600,.12,'square',.04,.14);}],           // ring ring
  [16.8,()=>{tone(1300,1300,.12,'square',.04);tone(1600,1600,.12,'square',.04,.14);}],
  [17.15,()=>tone(500,1100,.12,'sine',.08)],                                      // call pops up
  [22.3,()=>{tone(1200,1200,.06,'sine',.08);tone(1600,1600,.08,'sine',.08,.09);}],// family chat
  ...[22.6,22.75,22.9,23.05].map(x=>[x,()=>tone(1500,1500,.04,'sine',.04)]),      // ...and more messages
  [28.0,()=>{noise(.15,.15,600);[523,659,784,1047].forEach((f,i)=>swell(f,1.6,.05,i*.05));}], // freezer: ahhh
  [29.0,()=>{tone(700,700,.12,'sine',.07);tone(500,500,.18,'sine',.07,.14);}]      // call ended
];
const EV=SFX.concat(LINES.map(l=>[l.s,()=>{if(l.buf) playBuf(l.buf,0,l.v);}]));

async function loadVoices(){
  const c=ctx();
  if(!c){failed=LINES.length;return updateStatus();}
  await Promise.all(LINES.map(async l=>{
    try{
      const r=await fetch('audio/'+l.f+'.mp3');if(!r.ok) throw new Error(r.status);
      const ab=await r.arrayBuffer();
      l.buf=await new Promise((res,rej)=>c.decodeAudioData(ab,res,rej));
      l.env=envOf(l.buf);loaded++;
    }catch(e){failed++;}
    updateStatus();
  }));
  if(playing) resumeVoices();
}
function updateStatus(){
  const n=LINES.length;
  if(loaded+failed<n) E.status.textContent='טוען את הקולות... '+loaded+' מתוך '+n;
  else if(!failed) E.status.textContent='הקולות מוכנים. הפעילו סאונד ולחצו על הסרטון.';
  else E.status.textContent='לא הצלחנו לטעון '+failed+' מתוך '+n+' קולות. בדקו את החיבור לאינטרנט ורעננו את הדף.';
}
function resumeVoices(){ // pick up any line already under way (after resume or seek)
  if(!AC) return;
  for(const l of LINES) if(l.buf&&T>=l.s&&T<l.s+l.d-.1) playBuf(l.buf,T-l.s,l.v);
}

/* ---------- #preview: loop a highlight silently (no audio events fire) ---------- */
function startPreview(a,b){
  if(!document.documentElement.classList.contains('preview')) return;
  E.stage.style.pointerEvents='none';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(lerp(a,b,.5));return;}
  const t0=performance.now();
  (function pv(now){T=a+((now-t0)/1000)%(b-a);render(T);requestAnimationFrame(pv);})(t0);
}

/* ---------- player ---------- */
let T=0,playing=false,last=0,raf=0;
const ICON={
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-8z"/></svg>',
  on:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>',
  off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM15 9.4L17.6 12 15 14.6l1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6 2.6-2.6L21.6 8 19 10.6 16.4 8z"/></svg>'
};
function ui(){
  const ended=T>=DUR;
  E.pp.innerHTML=playing?ICON.pause:(ended?ICON.replay:ICON.play);
  E.pp.setAttribute('aria-label',playing?'עצור':(ended?'הפעל שוב':'הפעל'));
  E.bigplay.style.opacity=playing?0:1;
  E.bigplay.innerHTML=(ended?ICON.replay:ICON.play).replace('<svg','<svg style="fill:#161a2e"');
  E.mute.innerHTML=muted?ICON.off:ICON.on;
  E.mute.setAttribute('aria-label',muted?'הפעל סאונד':'השתק');
}
function frame(now){
  if(!playing) return;
  const dt=Math.min(.1,(now-last)/1000);last=now;
  const prev=T;T=Math.min(DUR,T+dt);
  if(AC) for(const [et,fn] of EV){ if(et>prev&&et<=T) fn(); }
  render(T);
  if(T>=DUR){playing=false;ui();return;}
  raf=requestAnimationFrame(frame);
}
function play(){
  if(T>=DUR) T=0;
  ac();playing=true;last=performance.now();ui();
  resumeVoices();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
}
function pause(){playing=false;cancelAnimationFrame(raf);stopAll();ui();}
function toggle(){playing?pause():play();}
E.stage.addEventListener('click',toggle);
E.pp.addEventListener('click',toggle);
E.mute.addEventListener('click',()=>{muted=!muted;if(master) master.gain.value=muted?0:1;ui();});
E.seek.addEventListener('input',()=>{T=parseFloat(E.seek.value);stopAll();render(T);ui();});
E.seek.addEventListener('change',()=>{if(playing) resumeVoices();});
ui();render(0);updateStatus();loadVoices();
startPreview(11.5,24.5);
})();
