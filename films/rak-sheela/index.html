<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>רק שאלה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800&family=Secular+One&display=swap">
<script>/* #preview: silent looping highlight for the gallery card; #embed: player inside the gallery */
(function(){const m=location.hash.slice(1);if(m==='preview'||m==='embed')document.documentElement.classList.add(m);})();</script>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:14px}
html.preview body{padding:0;background:#000;overflow:hidden}
html.preview .head,html.preview .ctl,html.preview #status,html.preview .title,html.preview .bigplay{display:none!important}
html.preview .wrap{max-width:none;gap:0}
html.preview .stage{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none;cursor:default}
html.embed .head{display:none}
html.embed body{padding-block:8px}
/* layout: phone-shaped stage (a clinic waiting room, flat cartoon with thick outlines), slim controls underneath */
:root{
  --bg:#eef3f1; --fg:#17201d; --muted:#5d6b66; --accent:#e2483d; --panel:#ffffff; --line:#d3ddd9;
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111614; --fg:#e9f0ed; --muted:#9fb0a9; --accent:#ff6f5e; --panel:#1c2421; --line:#2f3a36; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111614; --fg:#e9f0ed; --muted:#9fb0a9; --accent:#ff6f5e; --panel:#1c2421; --line:#2f3a36; color-scheme:dark}

body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.head{width:100%}
h1{font:400 26px/1.1 var(--font-display);margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}

.stage{
  position:relative; aspect-ratio:9/16; width:min(100%, max(220px, calc((100svh - 210px) * .5625)));
  border-radius:16px; overflow:hidden; background:#cfe8de; container-type:inline-size;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 0 0 1px var(--line);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}
.title{inset:0;background:#17201d;color:#7fe0b4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;text-align:center;padding:8cqw}
.title small{font:800 4.4cqw var(--font-body);color:#ffb0a6}
.title h2{font:400 20cqw/1 var(--font-display);margin:0}
.title p{margin:0;font:500 5cqw var(--font-body);color:#e9f0ed}
.cap{left:0;right:0;top:40%;text-align:center;font:400 9cqw/1.1 var(--font-display);color:#fff;text-shadow:0 .8cqw 0 #17201d,0 0 3cqw rgba(0,0,0,.6);opacity:0}
.end{left:10cqw;right:10cqw;bottom:8cqw;background:rgba(23,32,29,.95);color:#e9f0ed;border-radius:4cqw;padding:3.4cqw;text-align:center;opacity:0}
.end .fin{font:400 14cqw/1 var(--font-display);color:#7fe0b4}
.end small{display:block;margin-top:1.2cqw;font:500 3.6cqw/1.4 var(--font-body);color:#d8efe5}
.bigplay{left:50%;top:50%;width:22cqw;height:22cqw;margin:-11cqw 0 0 -11cqw;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1cqw 4cqw rgba(0,0,0,.35)}
.bigplay svg{position:static;width:10cqw;height:10cqw}

.ctl{width:100%;max-width:min(100%, 420px);display:flex;align-items:center;gap:10px;direction:ltr}
.ctl button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctl button:focus-visible,.ctl input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:44px;margin:0}
#time{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:34px;text-align:center}
#status{margin:0;color:var(--muted);font-size:13px;line-height:1.4;text-align:center}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">

        <!-- window: the sky runs day-night-day during the time skip -->

        <!-- clock -->

        <g stroke="#17201d" stroke-width="2.4" stroke-linecap="round"><path d="M62,80V84M62,124V128M38,104H42M82,104H86"/></g>

        <!-- poster: the joke is the waiting time -->

          <rect x="262" y="266" width="86" height="262" fill="#9b6a43" stroke="#17201d" stroke-width="3"/>
          <rect x="274" y="282" width="62" height="96" rx="4" fill="#8a5b37"/>
          <rect x="274" y="394" width="62" height="118" rx="4" fill="#8a5b37"/>
          <rect x="278" y="304" width="54" height="40" rx="3" fill="#fff" stroke="#17201d" stroke-width="2"/>
          <text x="305" y="320" text-anchor="middle" font-family="Heebo, sans-serif" font-weight="800" font-size="9" fill="#e2483d">כניסה לפי</text>
          <text x="305" y="336" text-anchor="middle" font-family="Heebo, sans-serif" font-weight="800" font-size="9" fill="#e2483d">תור בלבד!</text>
          <circle cx="272" cy="404" r="5" fill="#ffd23f" stroke="#17201d" stroke-width="2"/>
        </g>
        <!-- chairs -->
        <g id="chairs" stroke="#17201d" stroke-width="3">
          <g><rect x="22" y="404" width="66" height="70" rx="12" fill="#2f7fd1"/><rect x="18" y="466" width="74" height="16" rx="6" fill="#2a6fb6"/><path d="M28,482V550M82,482V550" stroke-width="5"/></g>
          <g><rect x="102" y="404" width="66" height="70" rx="12" fill="#2f7fd1"/><rect x="98" y="466" width="74" height="16" rx="6" fill="#2a6fb6"/><path d="M108,482V550M162,482V550" stroke-width="5"/></g>
          <g><rect x="182" y="404" width="66" height="70" rx="12" fill="#2f7fd1"/><rect x="178" y="466" width="74" height="16" rx="6" fill="#2a6fb6"/><path d="M188,482V550M242,482V550" stroke-width="5"/></g>
        </g>
        <g id="web" opacity="0" fill="none" stroke="#ffffff" stroke-width="1.4"><path d="M102,404 L140,404 M102,404 L102,442 M102,404 L132,434 M114,404 Q110,412 102,416 M126,404 Q122,422 102,428 M138,404 Q132,430 102,440"/></g>

    <div class="ov cap" id="cap">שלוש שעות אחר כך...</div>
    <div class="ov end" id="end"><div class="fin">הסוף</div><small>מבוסס על אינספור סיפורים אמיתיים. בכל קופת חולים.</small></div>
    <div class="ov title" id="title">
      <small>סרט קצר</small>

<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const eo=u=>1-Math.pow(1-u,3);
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const win=(t,a,b,f)=>seg(t,a,a+(f||.25))*(1-seg(t,b-(f||.25),b)); // 0→1→0 over [a,b]
const A=(el,k,v)=>el.setAttribute(k,v);
const DUR=30, SEC=0, MOT=1, ZVI=2, SAV=3, DEL=4, NEW=5;
const DOOR_X=306, OUT=-60;

/* ---------- cast: every person is one template (legs, torso, arms, head) ---------- */
const CH=[
 null, // the secretary is only a voice on the intercom
 {id:'m',r:25,skin:'#f2c29b',brow:'#4a3020',bw:2.8,my:14,shirt:'#3d7be0',pants:'#2f4a7a',shoe:'#3a2a1e',
  back:'<path id="mBeard" fill="#5b3a22" stroke="#17201d" stroke-width="2.5"/>',
  front:'<path d="M-25,-4 C-26,-30 26,-32 25,-4 C16,-16 -14,-18 -25,-4Z" fill="#5b3a22"/>',over:''},
 {id:'z',r:25,skin:'#d6a07a',brow:'#141414',bw:3.2,my:14,shirt:'#ff6fa0',pants:'#f4f1ea',shoe:'#c9a227',chain:1,
  back:'',
  front:'<path d="M-25,-6 C-24,-33 24,-33 25,-6 C20,-26 -14,-22 -25,-6Z" fill="#141414"/><path d="M-17,12 Q0,30 17,12" stroke="#7a5a42" stroke-width="5" fill="none" opacity=".3"/>',
  over:'<g><rect x="-21" y="-25" width="18" height="9" rx="4" fill="#222"/><rect x="3" y="-25" width="18" height="9" rx="4" fill="#222"/><path d="M-3,-21h6" stroke="#222" stroke-width="2"/></g>'},
 {id:'s',r:24,skin:'#f1c3a0',brow:'#d9d4cc',bw:3,my:13,shirt:'#8e5aa8',pants:'#6b4180',shoe:'#3a2a1e',skirt:1,
  back:'<circle cx="0" cy="-29" r="12" fill="#eeeae4" stroke="#17201d" stroke-width="2.5"/>',
  front:'<path d="M-24,-2 C-26,-30 26,-30 24,-2 C20,-20 -20,-20 -24,-2Z" fill="#eeeae4"/><g fill="#ff9aa2" opacity=".55"><circle cx="-14" cy="8" r="5"/><circle cx="14" cy="8" r="5"/></g>',
  over:'<g fill="none" stroke="#b5833a" stroke-width="2"><circle cx="-9" cy="-1" r="8"/><circle cx="9" cy="-1" r="8"/><path d="M-1,-1h2"/></g>'},
 {id:'d',r:25,skin:'#e0a882',brow:'#3a2618',bw:3,my:14,shirt:'#ffc93c',pants:'#4a4f5c',shoe:'#222',
  back:'',
  front:'<path d="M-26,-6 C-26,-31 26,-31 26,-6Z" fill="#d93a2f" stroke="#17201d" stroke-width="2.5"/><path d="M-8,-8 H34 Q37,-2 30,-2 H-8Z" fill="#b52a21" stroke="#17201d" stroke-width="2.5"/>',over:''},
 {id:'n',r:25,skin:'#efc19c',brow:'#c4561e',bw:2.8,my:14,shirt:'#3aa76d',pants:'#2b3340',shoe:'#f4f1ea',
  back:'<g fill="#e0702c" stroke="#17201d" stroke-width="2.5"><circle cx="-20" cy="-16" r="11"/><circle cx="0" cy="-26" r="12"/><circle cx="20" cy="-16" r="11"/></g>',
  front:'<path d="M-24,-6 C-22,-28 22,-28 24,-6 C14,-18 -14,-18 -24,-6Z" fill="#e0702c"/>',
  over:'<path d="M-28,2 Q-30,-40 0,-40 Q30,-40 28,2" stroke="#2f2f2f" stroke-width="5" fill="none"/><rect x="-34" y="-6" width="11" height="18" rx="5" fill="#2f9e5c" stroke="#17201d" stroke-width="2"/><rect x="23" y="-6" width="11" height="18" rx="5" fill="#2f9e5c" stroke="#17201d" stroke-width="2"/>'}
];
const OL='stroke="#17201d" stroke-width="3"';
(function build(){
  let h='';
  [NEW,MOT,ZVI,SAV,DEL].forEach(i=>{const c=CH[i];
    h+=`<g id="${c.id}P">
      <path id="${c.id}lg" fill="${c.pants}" ${OL}/><path id="${c.id}sh" fill="${c.shoe}" ${OL}/>
      <path id="${c.id}ts" fill="${c.shirt}" ${OL}/>
      ${c.chain?`<path id="${c.id}ch" fill="none" stroke="#ffd23f" stroke-width="3"/>`:''}
      <g id="${c.id}pr"></g>
      <path id="${c.id}ar" fill="none" stroke="#17201d" stroke-width="15" stroke-linecap="round"/><path id="${c.id}ai" fill="none" stroke="${c.shirt}" stroke-width="9" stroke-linecap="round"/>
      <circle id="${c.id}hL" r="7" fill="${c.skin}" ${OL}/><circle id="${c.id}hR" r="7" fill="${c.skin}" ${OL}/>
      <g id="${c.id}H">${c.back}<circle r="${c.r}" fill="${c.skin}" ${OL}/>${c.front}
        <ellipse id="${c.id}eL" cx="-9" cy="-1" rx="5.5" ry="6.5" fill="#fff" stroke="#17201d" stroke-width="1.6"/><ellipse id="${c.id}eR" cx="9" cy="-1" rx="5.5" ry="6.5" fill="#fff" stroke="#17201d" stroke-width="1.6"/>
        <circle id="${c.id}pL" cx="-9" cy="-1" r="2.8" fill="#1b1410"/><circle id="${c.id}pR" cx="9" cy="-1" r="2.8" fill="#1b1410"/>
        <path id="${c.id}bL" stroke="${c.brow}" stroke-width="${c.bw}" stroke-linecap="round" fill="none"/><path id="${c.id}bR" stroke="${c.brow}" stroke-width="${c.bw}" stroke-linecap="round" fill="none"/>
        <ellipse id="${c.id}mo" cx="0" cy="${c.my}" rx="6" ry="2" fill="#5a1020"/><path id="${c.id}sm" stroke="#5a1020" stroke-width="2.4" stroke-linecap="round" fill="none"/>${c.over}</g>
    </g>`;});
  $('people').innerHTML=h;
  // props held in the hands
  $('mpr').innerHTML='<g id="ticket"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff" stroke="#17201d" stroke-width="2"/><text y="5" text-anchor="middle" font-family="Secular One, sans-serif" font-size="12" fill="#e2483d">47</text></g>';
  $('zpr').innerHTML='<rect id="phone" x="-6" y="-11" width="12" height="22" rx="3" fill="#222" stroke="#17201d" stroke-width="2"/>';
  $('spr').innerHTML='<g id="bag"><path d="M-8,-10 Q0,-22 8,-10" fill="none" stroke="#17201d" stroke-width="2.5"/><rect x="-13" y="-10" width="26" height="20" rx="5" fill="#c94f7c" stroke="#17201d" stroke-width="2.5"/></g>';
  $('dpr').innerHTML='<g id="box"><rect x="-30" y="-24" width="60" height="44" rx="3" fill="#c98f52" stroke="#17201d" stroke-width="3"/><path d="M-30,-10H30M0,-24V-10" stroke="#a87038" stroke-width="3"/></g>';
  $('npr').innerHTML='<g id="ticket2"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff" stroke="#17201d" stroke-width="2"/><text y="5" text-anchor="middle" font-family="Secular One, sans-serif" font-size="12" fill="#e2483d">49</text></g>';
})();

/* ---------- script: who says what, when (s = start, d = speech length) ---------- */
const LINES=[
 {c:SEC,f:'01',s:.3,   d:1.85,radio:1}, // number forty-six.
 {c:MOT,f:'02',s:2.3,  d:1.76},          // yes! I'm next!
 {c:ZVI,f:'03',s:4.2,  d:1.77},          // excuse me, excuse me! just a question!
 {c:MOT,f:'04',s:6.1,  d:1.45},          // bro, there's a line here!
 {c:ZVI,f:'05',s:7.7,  d:2.30},          // it's not a line, it's a question! one second!
 {c:SAV,f:'06',s:10.15,d:3.03},          // wait! I also have just a question!
 {c:DEL,f:'07',s:13.3, d:2.29},          // delivery! just a question, where do I sign?
 {c:SEC,f:'08',s:18.0, d:4.56,radio:1},  // number forty-seven? ...no? number forty-eight.
 {c:MOT,f:'09',s:22.7, d:2.66},          // what?! wait! that's me!
 {c:MOT,f:'10',s:25.5, d:2.29},          // excuse me! just a question!
 {c:NEW,f:'11',s:27.9, d:1.53}           // bro, there's a line here!
];
const ENV_FPS=60;
function envOf(buf){ // loudness per 1/60 s (33 ms window), scaled so speech peaks open the mouth fully
  const ch=buf.getChannelData(0),hop=Math.max(1,Math.round(buf.sampleRate/ENV_FPS)),n=Math.ceil(ch.length/hop),e=new Float32Array(n);
  let pk=1e-6;
  for(let i=0;i<n;i++){
    const a=i*hop,b=Math.min(ch.length,a+hop*2);let s=0;
    for(let j=a;j<b;j++) s+=ch[j]*ch[j];
    e[i]=Math.sqrt(s/Math.max(1,b-a));if(e[i]>pk) pk=e[i];
  }
  for(let i=0;i<n;i++) e[i]=Math.min(1,e[i]/(pk*.7));
  return e;
}
function mouthOf(c,t){

/* ---------- faces over time ---------- */
const MOODS={

const MK=['es','bu','ba','sm','o'];

const blinkOf=(t,ph)=>Math.max(0,1-Math.abs((((t+ph)%3.5)-3.4)/.07));

/* ---------- blocking: where each person is, as a function of t ---------- */
// x, stand (0 seated .. 1 standing), op, sleep, pose
function walkTo(t,pts){ // pts: [[t,x],...] eased between keys
  if(t<=pts[0][0]) return pts[0][1];
  for(let k=1;k<pts.length;k++) if(t<pts[k][0]) return lerp(pts[k-1][1],pts[k][1],eio(seg(t,pts[k-1][0],pts[k][0])));

const inDoor=(t,a)=>1-seg(t,a,a+.35); // fade out through the doorway

    if(t>=6.1&&t<7.7) stand=.5*win(t,6.1,7.7,.25);                      // half up to protest
    if(t>=22.8) stand=eo(seg(t,22.8,23.15));

    else if(t>=25.3) pose=t>=28.4?'shrug':'finger';

    return {x,stand:1,op:t<3.95?0:inDoor(t,9.95),pose:t>=7.7&&t<9.5?'wave':'phone'};
  }
  if(i===SAV){
    const x=walkTo(t,[[10.8,55],[12.75,DOOR_X]]);

    return {x,stand,op:inDoor(t,12.85),pose:t>=10.15&&t<10.9?'finger':(t<10.15?'lap':'bag'),hunch:t>=10.15?1:0};

}
function lookAt(i,t,st){ // a point to look at, or null for straight ahead
  const DISP=[180,96],DOOR=[DOOR_X,380];
  const head=j=>{const s=stateOf(j,t);return [s.x,lerp(352,316,s.stand)];};
  if(i===MOT){
    if(t<2.3||(t>=22.7&&t<24.3)) return DISP;
    if(t>=4.0&&t<10.15) return head(ZVI);
    if(t>=10.15&&t<13.1) return head(SAV);
    if(t>=13.2&&t<15.6) return head(DEL);
    if(t>=24.3&&t<25.3) return DOOR;
    if(t>=25.5) return head(NEW);

  }

  if(i===SAV){ if(t>=4.0&&t<10.15) return head(ZVI); if(t>=10.15&&t<10.8) return head(MOT); return DOOR; }
  if(i===DEL) return t<14.6?head(MOT):DOOR;

/* ---------- render: everything is a pure function of t ---------- */
const TL0=15.7, TL1=17.9; // the time skip
function render(t){
  const tl=seg(t,TL0,TL1);
  // the now-serving number
  E.num.textContent=t<.28?'45':t<18.0?'46':t<21.32?'47':'48';
  A(E.num,'opacity',(t>=18&&t<19.2)||(t>=21.32&&t<22.3)?(Math.floor(t*6)%2?1:.25):1);
  const sec=mouthOf(SEC,t);
  A(E.waves,'opacity',sec>.1?.4+.6*sec:0);
  // clock spins and the window runs through night during the skip
  const mins=(t/60)*360+tl*360*3, hrs=mins/12+60;
  A(E.mnH,'transform',`rotate(${mins} 62 104)`);A(E.hrH,'transform',`rotate(${hrs} 62 104)`);
  const night=Math.sin(tl*Math.PI*2-Math.PI/2)*.5+.5; // 0 day → 1 night → 0 day
  A(E.sky,'fill',night>.5?'#1d2b55':'#8fd3f5');
  A(E.sun,'fill',night>.5?'#f4f1ea':'#ffe27a');
  A(E.sun,'cy',200+((tl*2)%1)*50);
  A(E.tint,'opacity',night*.35);
  A(E.web,'opacity',seg(t,16.6,17.5)*(1-seg(t,22.7,23)));
  // Moti's beard grows during the skip and stays
  const g=seg(t,TL0+.2,TL1);
  A(E.mBeard,'d',g>0?`M-25,-2Q-30,${24+44*g} 0,${30+52*g}Q30,${24+44*g} 25,-2Z`:'');
  // the door swings for everyone who "only has a question"
  const open=Math.max(win(t,9.75,10.55,.2),win(t,12.65,13.45,.2),win(t,15.05,15.8,.2),win(t,28.75,29.5,.2));
  A(E.door,'transform',`translate(348 0) scale(${1-.82*open} 1) translate(-348 0)`);

  let mh=null;
  [NEW,MOT,ZVI,SAV,DEL].forEach(i=>{const r=drawPerson(i,t);if(i===MOT) mh=r;});
  // snores
  const sl=seg(t,16.2,16.8)*(1-seg(t,22.7,22.8));
  A(E.zzz,'opacity',sl);
  if(mh&&sl>0) ZZ.forEach((z,k)=>{const u=((t*.6)+k/3)%1;A(z,'x',mh.x+26+u*30+k*4);A(z,'y',mh.hy-20-u*50);A(z,'opacity',1-u);});

  E.cap.style.opacity=win(t,TL0+.05,TL1+.05,.25);
  E.end.style.opacity=eo(seg(t,29.45,29.8));
  E.title.style.opacity=(t<.05&&!playing)?1:0;
  E.seek.value=t;
  E.time.textContent='0:'+String(Math.floor(t)).padStart(2,'0');
}

/* ---------- audio: Web Audio for voices and the synthesized effects ---------- */
let AC=null,master=null,noiseBuf=null,muted=false,loaded=0,failed=0;
const live=new Set();
function ctx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;if(!C) return null;
  try{AC=new C();}catch(e){return null;}
  master=AC.createGain();master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return AC;
}
function ac(){ // from a tap: wake the context, and on iPhone play even with the silent switch on
  try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
  if(!ctx()) return null;
  if(AC.state==='suspended') AC.resume();
  const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
  return AC;
}
function track(s){live.add(s);s.onended=()=>live.delete(s);return s;}
function stopAll(){live.forEach(s=>{try{s.stop();}catch(e){}});live.clear();}
function playBuf(buf,off,radio){
  const s=AC.createBufferSource();s.buffer=buf;
  let out=s;
  if(radio){ // the secretary comes through a cheap ceiling speaker
    const hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter();
    hp.type='highpass';hp.frequency.value=450;lp.type='lowpass';lp.frequency.value=3200;
    s.connect(hp);hp.connect(lp);out=lp;
  }
  out.connect(master);s.start(0,off||0);track(s);
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);track(o);
}
function noise(dur,vol,freq,delay){
  if(!AC) return;
  const t0=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.5);s.stop(t0+dur+.02);track(s);
}
const dingDong=()=>{tone(988,988,.5,'sine',.12);tone(784,784,.7,'sine',.12,.28);};

const SFX=[
  [.28,dingDong],

];
const EV=SFX.concat(LINES.map(l=>[l.s,()=>{if(l.buf) playBuf(l.buf,0,l.radio);}]));

async function loadVoices(){
  const c=ctx();
  if(!c){failed=LINES.length;return updateStatus();}
  await Promise.all(LINES.map(async l=>{
    try{
      const r=await fetch('audio/'+l.f+'.mp3');if(!r.ok) throw new Error(r.status);
      const ab=await r.arrayBuffer();
      l.buf=await new Promise((res,rej)=>c.decodeAudioData(ab,res,rej));
      l.env=envOf(l.buf);loaded++;
    }catch(e){failed++;}
    updateStatus();
  }));
  if(playing) resumeVoices();
}
function updateStatus(){
  const n=LINES.length;
  if(loaded+failed<n) E.status.textContent='טוען את הקולות... '+loaded+' מתוך '+n;
  else if(!failed) E.status.textContent='הקולות מוכנים. הפעילו סאונד ולחצו על הסרטון.';
  else E.status.textContent='לא הצלחנו לטעון '+failed+' מתוך '+n+' קולות. בדקו את החיבור לאינטרנט ורעננו את הדף.';
}
function resumeVoices(){ // pick up any line already under way (after resume or seek)
  if(!AC) return;
  for(const l of LINES) if(l.buf&&T>=l.s&&T<l.s+l.d-.1) playBuf(l.buf,T-l.s,l.radio);
}

/* ---------- #preview: loop a highlight silently (no audio events fire) ---------- */
function startPreview(a,b){
  if(!document.documentElement.classList.contains('preview')) return;
  E.stage.style.pointerEvents='none';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){render(lerp(a,b,.5));return;}
  const t0=performance.now();
  (function pv(now){T=a+((now-t0)/1000)%(b-a);render(T);requestAnimationFrame(pv);})(t0);
}

  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-8z"/></svg>',
  on:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>',
  off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM15 9.4L17.6 12 15 14.6l1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6 2.6-2.6L21.6 8 19 10.6 16.4 8z"/></svg>'
};
function ui(){
  const ended=T>=DUR;
  E.pp.innerHTML=playing?ICON.pause:(ended?ICON.replay:ICON.play);
  E.pp.setAttribute('aria-label',playing?'עצור':(ended?'הפעל שוב':'הפעל'));
  E.bigplay.style.opacity=playing?0:1;
  E.bigplay.innerHTML=(ended?ICON.replay:ICON.play).replace('<svg','<svg style="fill:#17201d"');
  E.mute.innerHTML=muted?ICON.off:ICON.on;
  E.mute.setAttribute('aria-label',muted?'הפעל סאונד':'השתק');
}
function frame(now){
  if(!playing) return;
  const dt=Math.min(.1,(now-last)/1000);last=now;
  const prev=T;T=Math.min(DUR,T+dt);
  if(AC) for(const [et,fn] of EV){ if(et>prev&&et<=T) fn(); }
  render(T);
  if(T>=DUR){playing=false;ui();return;}
  raf=requestAnimationFrame(frame);
}
function play(){
  if(T>=DUR) T=0;
  ac();playing=true;last=performance.now();ui();
  resumeVoices();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
}
function pause(){playing=false;cancelAnimationFrame(raf);stopAll();ui();}
function toggle(){playing?pause():play();}
E.stage.addEventListener('click',toggle);
E.pp.addEventListener('click',toggle);
E.mute.addEventListener('click',()=>{muted=!muted;if(master) master.gain.value=muted?0:1;ui();});
E.seek.addEventListener('input',()=>{T=parseFloat(E.seek.value);stopAll();render(T);ui();});
E.seek.addEventListener('change',()=>{if(playing) resumeVoices();});

ui();render(0);updateStatus();loadVoices();
startPreview(3.8,15.6);
})();
</script>
