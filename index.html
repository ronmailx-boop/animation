<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>נו, באמת</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'><circle cx='24' cy='24' r='22' fill='%23ffc94a' stroke='%23140f1c' stroke-width='3'/><ellipse cx='16' cy='20' rx='6' ry='7' fill='%23fff' stroke='%23140f1c' stroke-width='2.5'/><ellipse cx='32' cy='20' rx='6' ry='7' fill='%23fff' stroke='%23140f1c' stroke-width='2.5'/><circle cx='17' cy='15.5' r='3' fill='%23140f1c'/><circle cx='33' cy='15.5' r='3' fill='%23140f1c'/><path d='M16 34h16' stroke='%23140f1c' stroke-width='3' stroke-linecap='round'/></svg>">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="נו, באמת — סרטוני אנימציה של 30 שניות על החיים בישראל. מצוירים בקוד ומדובבים בקולות של ElevenLabs.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&family=Secular+One&display=swap">
<style>
/* layout: a full-screen vertical feed, one film per screen, like TikTok. Swipe up for the next film, it starts by itself. */
:root{
  --bg:#000; --panel:#1c1724; --fg:#fff; --muted:rgba(255,255,255,.78); --marquee:#ffc94a; --accent:#fe2c55; --line:rgba(255,255,255,.18);
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--font-body);overflow:hidden}
button{font:inherit;color:inherit}

.feed{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;background:#000}
/* the film keeps 9:16 on a computer; on a phone it fills the screen */
.screen{position:relative;height:100%;width:min(100vw, calc(100svh * 9 / 16));overflow:hidden;background:#0c0a10}
.screen img,.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.screen img{object-fit:cover}
.screen iframe{opacity:0;transition:opacity .3s}
.screen iframe.on{opacity:1}

/* overlays let taps through to the film, except on their buttons */
.top{position:absolute;inset:0 0 auto 0;z-index:2;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 26px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.top b{font:400 19px var(--font-display);color:var(--marquee)}
.top span{font:800 16px var(--font-body);padding-bottom:4px;border-bottom:3px solid #fff}
.cap{position:absolute;inset:auto 0 0 0;z-index:2;pointer-events:none;
  padding:60px 84px calc(22px + env(safe-area-inset-bottom,0px)) 14px;padding-inline:14px 84px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cap .who{font:800 16px var(--font-body)}
.cap h2{margin:4px 0 2px;font:400 22px/1.15 var(--font-display)}
.cap p{margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .tags{margin-top:4px;font-weight:800;font-size:14px}
.cap .snd{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:13px;overflow:hidden;white-space:nowrap}
.cap .snd svg{width:14px;height:14px;fill:currentColor;flex:none}
.cap .snd i{font-style:normal;display:inline-block;animation:tick 9s linear infinite}
@keyframes tick{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.badge{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:4px;background:var(--accent);font:800 12px/20px var(--font-body);vertical-align:3px;text-shadow:none}

.rail{position:absolute;inset-inline-end:8px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px}
.logo{width:50px;height:50px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin-bottom:6px;overflow:hidden;background:#ffc94a}
.logo svg{width:100%;height:100%}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:0;border:0;background:none;cursor:pointer;font:800 12px var(--font-body);text-shadow:0 1px 2px rgba(0,0,0,.6);-webkit-tap-highlight-color:transparent}
.act span.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.act svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));transition:transform .15s}
.act[aria-pressed="true"] svg{fill:var(--accent)}
.act:active svg{transform:scale(.85)}
.act:focus-visible{outline:3px solid var(--marquee);outline-offset:2px;border-radius:12px}

.bar{position:absolute;inset:auto 0 0 0;z-index:3;height:3px;background:rgba(255,255,255,.2);pointer-events:none}
.bar i{display:block;height:100%;width:0;background:#fff}

/* the first tap: browsers only allow sound after one */
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;
  background:rgba(0,0,0,.55);border:0;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#start .pp{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#start .pp svg{width:44px;height:44px;fill:#111;margin-inline-start:6px}
#start h1{margin:0;font:400 40px/1.1 var(--font-display);color:var(--marquee)}
#start .face svg{width:72px;height:72px;display:block}
#start p{margin:0;font:500 16px var(--font-body);color:#fff;max-width:28ch}
#start:focus-visible .pp{outline:4px solid var(--marquee);outline-offset:4px}
#start[hidden]{display:none}
#hint{position:fixed;inset:auto 0 42% 0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;
  font:800 15px var(--font-body);text-shadow:0 1px 3px rgba(0,0,0,.7);opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#hint svg{width:34px;height:34px;fill:#fff;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-10px)}}

/* share sheet (when the phone's own share menu is not available) */
dialog{padding:0;border:0;background:var(--panel);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#shareSheet{width:min(420px,100vw);max-width:100vw;height:fit-content;max-height:100svh;margin:auto auto 0;border-radius:18px 18px 0 0;padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
@media (min-width:700px){#shareSheet{margin:auto;border-radius:18px;box-shadow:0 0 0 1px var(--line)}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-head h2{margin:0;font:400 20px/1.2 var(--font-display)}
.close{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.close svg{width:18px;height:18px;fill:currentColor}
.sh-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sh-opt{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);font:500 15px var(--font-body);text-decoration:none;cursor:pointer}
.sh-opt svg{width:24px;height:24px;flex:none}
.sh-opt:focus-visible,.close:focus-visible{outline:3px solid var(--marquee);outline-offset:2px}
#shMsg{margin:12px 0 0;min-height:1.5em;color:var(--marquee);font-size:14px;text-align:center}

@media (prefers-reduced-motion: reduce){.cap .snd i,#hint svg{animation:none}.feed{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="feed" id="feed" aria-label="סרטונים"></main>

<button id="start" type="button">
  <span class="pp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
  <span class="face"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#ffc94a" stroke="#140f1c" stroke-width="3"/><ellipse cx="16" cy="20" rx="6" ry="7" fill="#fff" stroke="#140f1c" stroke-width="2.5"/><ellipse cx="32" cy="20" rx="6" ry="7" fill="#fff" stroke="#140f1c" stroke-width="2.5"/><circle cx="17" cy="15.5" r="3" fill="#140f1c"/><circle cx="33" cy="15.5" r="3" fill="#140f1c"/><path d="M16 34h16" stroke="#140f1c" stroke-width="3" stroke-linecap="round"/></svg></span>
  <h1>נו, באמת</h1>
  <p>סרטוני אנימציה של 30 שניות על החיים בישראל. הקישו כדי להתחיל עם קול, וגללו למעלה לסרטון הבא.</p>
</button>
<div id="hint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4l-7 7 1.4 1.4L11 7.8V20h2V7.8l4.6 4.6L19 11z"/></svg>גללו לסרטון הבא</div>

<dialog id="shareSheet" aria-labelledby="shTitle">
  <div class="sh-head">
    <h2 id="shTitle">שיתוף</h2>
    <button class="close" id="shClose" type="button" aria-label="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg></button>
  </div>
  <ul class="sh-list">
    <li><a class="sh-opt" id="shWa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#25d366"/><path fill="#fff" d="M12 5.2a6.8 6.8 0 0 0-5.9 10.2L5.2 18.8l3.5-.9A6.8 6.8 0 1 0 12 5.2zm3.9 9.5c-.2.5-1 .9-1.4.9-.4.1-.8.1-2.6-.6-2.2-.9-3.6-3.1-3.7-3.3-.1-.1-.9-1.2-.9-2.3s.6-1.6.8-1.8c.2-.2.4-.3.6-.3h.4c.1 0 .3 0 .5.4l.7 1.6c.1.1.1.3 0 .4l-.3.4-.3.4c-.1.1-.2.2-.1.4.2.3.6 1 1.3 1.6.9.8 1.6 1 1.8 1.1.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.5-.1l1.5.7c.2.1.4.2.4.3.1.1.1.6-.1 1.1z"/></svg>וואטסאפ</a></li>
    <li><a class="sh-opt" id="shTg" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#29a9eb"/><path fill="#fff" d="M5.5 11.6l11.2-4.3c.5-.2 1 .1.8.9l-1.9 9c-.1.6-.5.8-1 .5l-2.9-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-3 5.4-4.9c.2-.2 0-.3-.3-.1l-6.7 4.2-2.9-.9c-.6-.2-.6-.6.1-.9z"/></svg>טלגרם</a></li>
    <li><a class="sh-opt" id="shFb" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1877f2"/><path fill="#fff" d="M13.2 19v-6h2l.3-2.4h-2.3V9.1c0-.7.2-1.2 1.2-1.2h1.2V5.8c-.2 0-1-.1-1.8-.1-1.8 0-3 1.1-3 3.1v1.8h-2V13h2v6z"/></svg>פייסבוק</a></li>
    <li><a class="sh-opt" id="shMail"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ff6b4a"/><path fill="#fff" d="M6 8h12v8H6zm1 1v.3l5 3.3 5-3.3V9zm0 1.5V15h10v-4.5l-5 3.3z"/></svg>מייל</a></li>
    <li style="grid-column:1/-1"><button class="sh-opt" id="shCopy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffc94a"/><path fill="#1c1408" d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zm-1.8 3.2a3 3 0 0 1-2.1-5.1l1.4-1.4 1.4 1.4-1.4 1.4a1 1 0 0 0 1.4 1.4l1.4-1.4 1.4 1.4-1.4 1.4a3 3 0 0 1-2.1.9zm6.4-3.2l-1.4-1.4 1.4-1.4a1 1 0 0 0-1.4-1.4l-1.4 1.4-1.4-1.4 1.4-1.4a3 3 0 0 1 4.2 4.2z"/></svg>העתקת קישור</button></li>
  </ul>
  <p id="shMsg" role="status"></p>
</dialog>

<script>
/* one AudioContext for the whole feed. It exists before any film loads (the films pick it up from here),
   and the first tap unlocks it, so every film after that can start with sound on its own. */
(function(){const C=window.AudioContext||window.webkitAudioContext;if(C){try{window.__ac=new C();}catch(e){}}})();

(function(){
/* the catalogue: newest first. Each film lives in films/<slug>/ with its own poster.jpg */
const FILMS=[
  {slug:'yom-pijamot',title:"יום פיג'מות",dur:'0:30',isNew:true,
   logline:'רבע לחצות, מירי הגננת כותבת בקבוצת ההורים. 214 הודעות אחר כך, יעל יודעת בדיוק מתי יום פיג\'מות.',
   cast:['יעל','מירי הגננת','הורי הגן']},
  {slug:'achalta',title:'אכלת?',dur:'0:30',
   logline:'ארוחת שישי אצל אמא. דני בדיאטה. שלושה שניצלים זה טעימה, ומה שנשאר הולך הביתה בקופסאות.',
   cast:['דני','אמא','אבא']},
  {slug:'shomeret-chanaya',title:'שומרת חנייה',dur:'0:30',
   logline:'עשרים דקות של סיבובים, ויוסי מוצא חנייה. רינה כבר עומדת בה, ושומרת אותה לבעלה. הוא בדרך. מאילת.',
   cast:['יוסי','רינה','שמוליק (בטלפון)']},
  {slug:'rak-sheela',title:'רק שאלה',dur:'0:30',
   logline:'חדר המתנה בקופת חולים. מוטי הבא בתור, אבל לכולם יש רק שאלה.',
   cast:['מוטי','צביקה','סבתא','השליח','המזכירה']},
  {slug:'shiur-nehiga',title:'שיעור נהיגה',dur:'0:30',
   logline:'שיעור ראשון של סבתא רחל. המורה מבקש להתחיל לאט. היא נוהגת מאז 62.',
   cast:['סבתא רחל','המורה','השוטר']},
  {slug:'hamekarer-hachacham',title:'המקרר החכם',dur:'0:30',
   logline:'שתיים ורבע בלילה, אבי מתגנב לעוגה של אמא. המקרר החכם רואה הכל, ויש לו קשרים.',
   cast:['אבי','המקרר','אמא']},
  {slug:'hameshulash-haacharon',title:'המשולש האחרון',dur:'0:30',
   logline:'ארבעה בני משפחה מנומסים מדי בשביל לקחת את משולש הפיצה האחרון. ואז האור כבה.',
   cast:['אבא','אמא','נועה','סבא','הכלב']},
  {slug:'bitul-minui',title:'ביטול מנוי',dur:'0:30',
   logline:'עומר רק רוצה לבטל את המנוי לחדר הכושר. דנה, נציגת השירות, לא מוותרת עליו.',
   cast:['דנה','עומר']}
];
const ICON={
  share:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.2 1l-7-4a3 3 0 0 0 0-2l7-4A3 3 0 1 0 15 5l-7 4a3 3 0 1 0 0 6l7 4a3 3 0 1 0 3-3z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-8z"/></svg>',
  note:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h7V3z"/></svg>',
  logo:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#ffc94a" stroke="#140f1c" stroke-width="3"/><ellipse cx="16" cy="20" rx="6" ry="7" fill="#fff" stroke="#140f1c" stroke-width="2.5"/><ellipse cx="32" cy="20" rx="6" ry="7" fill="#fff" stroke="#140f1c" stroke-width="2.5"/><circle cx="17" cy="15.5" r="3" fill="#140f1c"/><circle cx="33" cy="15.5" r="3" fill="#140f1c"/><path d="M16 34h16" stroke="#140f1c" stroke-width="3" stroke-linecap="round"/></svg>'
};
const feed=document.getElementById('feed'),startBtn=document.getElementById('start'),hint=document.getElementById('hint');
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};

/* likes are a private bookmark on this phone only */
let liked={};try{liked=JSON.parse(localStorage.getItem('liked')||'{}')||{};}catch(e){}
const saveLikes=()=>{try{localStorage.setItem('liked',JSON.stringify(liked));}catch(e){}};

const slides=FILMS.map((f,i)=>{
  const sec=el('section','slide');sec.setAttribute('aria-label',f.title);sec.dataset.i=i;
  const scr=el('div','screen');
  const img=el('img');img.src='films/'+f.slug+'/poster.jpg';img.alt='';img.loading=i<2?'eager':'lazy';
  const fr=el('iframe');fr.title='הסרט '+f.title;fr.setAttribute('allow','autoplay');
  scr.append(img,fr);

  const top=el('div','top');top.append(el('b',null,'נו, באמת'),el('span',null,'בשבילך'));

  const cap=el('div','cap');
  const who=el('div','who'),handle=el('bdi',null,'@nu.beemet');handle.dir='ltr';who.append(handle);cap.append(who);
  const h=el('h2',null,f.title);if(f.isNew) h.append(el('span','badge','חדש'));
  cap.append(h,el('p',null,f.logline),el('div','tags',f.cast.map(c=>'#'+c.replace(/[()]/g,'').trim().replace(/\s+/g,'_')).join(' ')));
  const snd=el('div','snd');snd.innerHTML=ICON.note;snd.append(el('i',null,'צליל מקורי · '+f.cast.join(', ')+' · קולות ElevenLabs'));cap.append(snd);

  const rail=el('div','rail');
  const logo=el('div','logo');logo.innerHTML=ICON.logo;
  const like=el('button','act');like.type='button';like.setAttribute('aria-label','לייק ל'+f.title);
  like.setAttribute('aria-pressed',liked[f.slug]?'true':'false');
  like.innerHTML='<span class="ic">'+ICON.heart+'</span>';like.append(el('span',null,'לייק'));
  like.addEventListener('click',()=>{liked[f.slug]=!liked[f.slug];if(!liked[f.slug]) delete liked[f.slug];like.setAttribute('aria-pressed',liked[f.slug]?'true':'false');saveLikes();});
  const share=el('button','act');share.type='button';share.setAttribute('aria-label','שיתוף '+f.title);
  share.innerHTML='<span class="ic">'+ICON.share+'</span>';share.append(el('span',null,'שיתוף'));
  share.addEventListener('click',()=>shareFilm(f));
  const again=el('button','act');again.type='button';again.setAttribute('aria-label','מההתחלה');
  again.innerHTML='<span class="ic">'+ICON.replay+'</span>';again.append(el('span',null,'מההתחלה'));
  again.addEventListener('click',()=>withFilm(s,fl=>fl.restart()));
  rail.append(logo,like,share,again);

  const bar=el('div','bar');const fill=el('i');bar.append(fill);
  scr.append(top,cap,rail,bar);sec.append(scr);feed.append(sec);

  const s={f,sec,fr,fill,loaded:false,pending:null};
  fr.addEventListener('load',()=>{
    if(!fr.getAttribute('src')) return;
    s.loaded=true;fr.classList.add('on');
    if(s.pending){const fn=s.pending;s.pending=null;withFilm(s,fn);}
  });
  return s;
});

/* the film's own controls, once its page has loaded (window.film, set by #feed mode) */
function withFilm(s,fn){
  let film=null;try{film=s.loaded&&s.fr.contentWindow&&s.fr.contentWindow.film;}catch(e){}
  if(film) fn(film); else s.pending=fn;
}
function load(s){if(!s.fr.getAttribute('src')){s.loaded=false;s.fr.src='films/'+s.f.slug+'/#feed';}}
function unload(s){if(s.fr.getAttribute('src')){s.fr.classList.remove('on');s.fr.removeAttribute('src');s.loaded=false;s.pending=null;}}

let active=-1,started=false;
function activate(i){
  if(i===active) return;
  if(active>=0){const prev=slides[active];prev.pending=null;withFilm(prev,fl=>fl.pause());prev.pending=null;}
  active=i;
  // keep the film on screen and its neighbours loaded, let the rest go
  slides.forEach((s,j)=>{if(Math.abs(j-i)<=1) load(s); else if(Math.abs(j-i)>2) unload(s);});
  if(started) withFilm(slides[i],fl=>fl.restart());
  if(i>0) hint.classList.remove('on');
  history.replaceState(null,'','#'+slides[i].f.slug);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) activate(+e.target.dataset.i);}),{root:feed,threshold:.6});
slides.forEach(s=>io.observe(s.sec));

/* progress line under the film that is playing */
(function tick(){
  const s=slides[active];
  if(s&&s.loaded){try{const fl=s.fr.contentWindow.film;if(fl) s.fill.style.width=Math.min(100,fl.time/fl.dur*100)+'%';}catch(e){}}
  requestAnimationFrame(tick);
})();

/* first tap: unlock the sound, start the film on screen */
startBtn.addEventListener('click',()=>{
  try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
  const ac=window.__ac;
  if(ac){
    if(ac.state==='suspended') ac.resume();
    const b=ac.createBufferSource();b.buffer=ac.createBuffer(1,1,22050);b.connect(ac.destination);b.start(0); // iPhone: wake it inside the tap
  }
  started=true;startBtn.hidden=true;
  if(active<0) activate(0);
  withFilm(slides[active],fl=>fl.restart());
  if(active===0){hint.classList.add('on');setTimeout(()=>hint.classList.remove('on'),4000);}
});

/* keyboard: arrows move between films */
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]')) return;
  if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();feed.scrollBy({top:feed.clientHeight,behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();feed.scrollBy({top:-feed.clientHeight,behavior:'smooth'});}
});

/* a shared link (#<slug>) lands on that film */
const linked=FILMS.findIndex(f=>f.slug===decodeURIComponent(location.hash.slice(1)));
if(linked>0) slides[linked].sec.scrollIntoView({block:'start'});

/* share: a link to this page that opens on the film (#<slug>).
   On phones the system share menu lists every installed app (WhatsApp etc.); elsewhere, our own sheet. */
const sheet=document.getElementById('shareSheet'),shMsg=document.getElementById('shMsg');
const filmUrl=f=>location.href.split('#')[0]+'#'+f.slug;
let shareUrl='';
async function shareFilm(f){
  const url=filmUrl(f),text='"'+f.title+'" – סרטון של 30 שניות מ"נו, באמת" 🙄';
  if(navigator.share){
    try{await navigator.share({title:f.title,text,url});return;}
    catch(e){if(e.name==='AbortError') return;} // cancelled by the user; any other error falls back to the sheet
  }
  shareUrl=url;
  const msg=encodeURIComponent(text+'\n'+url);
  document.getElementById('shWa').href='https://wa.me/?text='+msg;
  document.getElementById('shTg').href='https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text);
  document.getElementById('shFb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);
  document.getElementById('shMail').href='mailto:?subject='+encodeURIComponent(f.title)+'&body='+msg;
  document.getElementById('shTitle').textContent='שיתוף: '+f.title;
  shMsg.textContent='';
  if(sheet.showModal) sheet.showModal(); else location.href='https://wa.me/?text='+msg;
}
document.getElementById('shCopy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(shareUrl);shMsg.textContent='הקישור הועתק';}
  catch(e){shMsg.textContent='לא הצלחנו להעתיק. הנה הקישור: '+shareUrl;}
});
document.getElementById('shClose').addEventListener('click',()=>sheet.close());
sheet.addEventListener('click',e=>{if(e.target===sheet) sheet.close();});
})();
</script>
