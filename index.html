<style>
/* layout: phone-shaped split-screen call, rep on top, customer below, slim controls underneath */
:root{
  --bg:#ecebf6; --fg:#1d1540; --muted:#625c86; --accent:#7367f0; --panel:#ffffff; --line:#cfcbe6;
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121022; --fg:#ece9ff; --muted:#a29cc8; --accent:#9b91ff; --panel:#1c1936; --line:#332f58; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121022; --fg:#ece9ff; --muted:#a29cc8; --accent:#9b91ff; --panel:#1c1936; --line:#332f58; color-scheme:dark}

body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.head{width:100%}
h1{font:400 26px/1.1 var(--font-display);margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}

.stage{
  position:relative; aspect-ratio:9/16; width:min(100%, max(220px, calc((100svh - 230px) * .5625)));
  border-radius:16px; overflow:hidden; background:#dcd7ff; container-type:inline-size;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 0 0 1px var(--line);
}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}

.callbar{left:0;right:0;top:86.1cqw;height:5.6cqw;background:#1d1540;color:#fff;display:flex;align-items:center;justify-content:center;gap:2.4cqw;font:800 3.4cqw var(--font-body)}
.callbar i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:#3ddc84;display:block}
.callbar b{font-variant-numeric:tabular-nums;font-weight:800;direction:ltr}

.bub{max-width:none;background:#fff;color:#1b1410;border:.8cqw solid #1d1540;border-radius:4cqw;padding:2cqw 3.4cqw;
  font:800 5.4cqw/1.25 var(--font-body);text-align:center;opacity:0;transform:scale(.9);transition:opacity .12s, transform .12s}
.bub.on{opacity:1;transform:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-2.3cqw;width:3.6cqw;height:3.6cqw;margin-left:-1.8cqw;background:#fff;
  border-right:.8cqw solid #1d1540;border-bottom:.8cqw solid #1d1540;transform:rotate(45deg)}
#bubD{top:2.5cqw;left:4cqw;right:4cqw}
#bubO{top:96cqw;left:12cqw;right:12cqw;background:#fff8e6}
#bubO::after{background:#fff8e6}

.sticker{top:40cqw;right:5cqw;background:#1d1540;color:#ffd84d;border-radius:3cqw;padding:2cqw 3.4cqw;text-align:center;opacity:0;transform:rotate(6deg)}
.sticker b{display:block;font:400 11cqw/1 var(--font-display);direction:ltr}
.sticker small{font:800 3.4cqw var(--font-body);color:#fff}

.title{inset:0;background:#1d1540;color:#ffd84d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;text-align:center;padding:8cqw}
.title small{font:800 4.4cqw var(--font-body);color:#b8b1ff}
.title h2{font:400 20cqw/1 var(--font-display);margin:0}
.title p{margin:0;font:500 5cqw var(--font-body);color:#ece9ff}
.end{left:10cqw;right:10cqw;top:66cqw;background:rgba(29,21,64,.96);color:#ece9ff;border-radius:4cqw;padding:4cqw;text-align:center;opacity:0}
.end .fin{font:400 17cqw/1 var(--font-display);color:#ffd84d}
.end small{display:block;margin-top:1.4cqw;font:500 3.8cqw/1.4 var(--font-body);color:#cfc9ff}
.bigplay{left:50%;top:50%;width:22cqw;height:22cqw;margin:-11cqw 0 0 -11cqw;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 1cqw 4cqw rgba(0,0,0,.35)}
.bigplay svg{position:static;width:10cqw;height:10cqw}

.ctl{width:100%;max-width:min(100%, 420px);display:flex;align-items:center;gap:10px;direction:ltr}
.ctl button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ctl button:focus-visible,.ctl input:focus-visible,.load:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ctl svg{width:20px;height:20px;fill:currentColor}

#time{flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:34px;text-align:center}
.load{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;align-items:stretch}

.load input{position:absolute;opacity:0;width:1px;height:1px}
#status{margin:0;color:var(--muted);font-size:13px;line-height:1.4;text-align:center}
</style>

<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const eo=u=>1-Math.pow(1-u,3);
const eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const A=(el,k,v)=>el.setAttribute(k,v);

/* ---------- script + timing (durations are the real ElevenLabs clip lengths) ---------- */
const DUR=30, SPEED=1.25, GAP=.08, START=.25;
const LINES=[
 {w:'D',t:'כושר בכיף, דנה מדברת. איך אפשר לעזור?',d:3.6},
 {w:'O',t:'היי דנה. אני רוצה לבטל את המנוי.',d:2.64},
 {w:'D',t:'בשמחה! רק לפני, שלושה חודשים בחינם!',d:4.08},
 {w:'O',t:'לא. אני רוצה לבטל.',d:1.84},
 {w:'D',t:'ועוד מגבת במתנה!',d:2.0},
 {w:'O',t:'לא הייתי בחדר כושר מאז 2022.',d:3.84},
 {w:'D',t:'מאז 2022?! הלקוח שאנחנו לא יכולים לאבד!',d:5.68},
 {w:'O',t:'דנה. בבקשה. אני מתחנן.',d:3.2},
 {w:'D',t:'אני מבינה. ביטול רק בסניף, בשלוש לפנות בוקר, ביום שלישי הראשון בחודש.',d:6.4},
 {w:'O',t:'טוב. שמרי לי מגבת.',d:2.4}
];
(function(){let c=START;LINES.forEach(l=>{l.slot=l.d/SPEED;l.start=c;c+=l.slot+GAP;});})();
const S=LINES.map(l=>l.start);
// the ElevenLabs clips published next to this page, one per line
const VOICE_FILES=LINES.map((l,i)=>'audio/'+String(i+1).padStart(2,'0')+'.mp3');

/* ---------- moods per line (face targets after each line starts) ---------- */
const MD=[{bu:0,ba:0,eo:0,sm:6,tl:0,sw:0,ey:0},
 {bu:2,sm:8,tl:-2},{bu:0,sm:6,tl:0},{bu:3,eo:1,sm:9,tl:3},{bu:0,sm:7,tl:0},{bu:4,eo:2,sm:10,tl:-3},
 {bu:1,sm:5,tl:2},{bu:6,eo:4,sm:3,tl:0},{bu:0,sm:7,tl:0},{ba:2,eo:-2,sm:9,tl:3},{bu:2,ba:0,eo:0,sm:10,tl:-3}];
const MO=[{bu:0,ba:0,eo:0,sm:-1,tl:0,sw:0,ey:0},
 {sm:-1},{sm:-1},{ba:3,sm:-3},{ba:4,sm:-4},{bu:2,ba:0,eo:1,sm:-2},
 {bu:2,ba:-2,sm:-5,ey:.3},{bu:4,ba:0,eo:3,sm:-1,ey:0},{bu:5,ba:-5,eo:2,sm:-6,sw:1},{bu:1,ba:0,eo:-1,sm:-4,sw:1},{bu:0,ba:-2,eo:0,sm:-6,ey:1,tl:8,sw:0}];
const KEYS=['bu','ba','eo','sm','tl','sw','ey'];
function fill(arr,base){ // make each entry complete by inheriting from previous
  const out=[Object.assign({},base,arr[0])];
  for(let i=1;i<arr.length;i++) out.push(Object.assign({},out[i-1],arr[i]));
  return out;
}
const MDf=fill(MD,{}), MOf=fill(MO,{});
// mood index i+1 belongs to line i (index 0 = before first line)
function mood(arr,t){
  let i=-1; for(let k=0;k<S.length;k++){ if(t>=S[k]) i=k; }
  const cur=arr[i+1], prev=arr[Math.max(0,i)];
  const u=i<0?1:eio(seg(t,S[i],S[i]+.3));
  const r={}; KEYS.forEach(k=>r[k]=lerp(prev[k],cur[k],u)); return r;
}

/* ---------- elements ---------- */
const E={};
['dHead','dEL','dER','dPL','dPR','dBL','dBR','dMo','dSm','oHead','oEL','oER','oPL','oPR','oBL','oBR','oMo','oSm','oSweat',
 'oArmL','oHandL','poster','posterBg','towel','cal','spThread','spider','puff','phone','clock','dot',
 'bubD','bubO','sticker','end','title','bigplay','seek','time','pp','mute','stage','files','status'].forEach(k=>E[k]=$(k));

const blinkOf=(t,ph)=>Math.max(0,1-Math.abs((((t+ph)%3.3)-3.2)/.07));
function face(p,o){ // o: {L,R,PL,PR,BL,BR,Mo,Sm, cx, ex, ey0, ry, by, my, wid, flip}
  const ry=Math.max(.8,(o.ry+p.eo)*(1-.92*o.bl)*(1-p.ey*.9));
  A(o.L,'ry',ry);A(o.R,'ry',ry);
  const px=o.lookx, py=o.looky;
  A(o.PL,'cx',-o.ex+px);A(o.PR,'cx',o.ex+px);A(o.PL,'cy',o.ey0+py);A(o.PR,'cy',o.ey0+py);
  const vis=p.ey>.7?0:1;
  A(o.PL,'opacity',vis);A(o.PR,'opacity',vis);
  const by=o.by-p.bu;
  A(o.BL,'d',`M${-o.ex-10},${by} L${-o.ex+9},${by+p.ba}`);
  A(o.BR,'d',`M${o.ex-9},${by+p.ba} L${o.ex+10},${by}`);
  const open=o.open;
  if(open>.12){
    A(o.Mo,'opacity',1);A(o.Mo,'rx',o.wid*(.5+.4*open));A(o.Mo,'ry',1.5+open*8);A(o.Mo,'cy',o.my+open*2+(p.sm>0?1:0));
    A(o.Sm,'opacity',0);
  } else {
    A(o.Mo,'opacity',0);
    A(o.Sm,'opacity',1);
    A(o.Sm,'d',`M${-o.wid},${o.my} Q0,${o.my+p.sm*1.6} ${o.wid},${o.my}`);
  }
}

/* ---------- lip sync: loudness envelope of each clip ---------- */
const ENV_FPS=60;
function envOf(buf){ // RMS per 1/60 s of clip time (33 ms window), normalised so speech peaks open the mouth fully
  const ch=buf.getChannelData(0),hop=Math.max(1,Math.round(buf.sampleRate/ENV_FPS)),n=Math.ceil(ch.length/hop),e=new Float32Array(n);
  let pk=1e-6;
  for(let i=0;i<n;i++){
    const a=i*hop,b=Math.min(ch.length,a+hop*2);let s=0;
    for(let j=a;j<b;j++) s+=ch[j]*ch[j];
    e[i]=Math.sqrt(s/Math.max(1,b-a));if(e[i]>pk) pk=e[i];
  }
  for(let i=0;i<n;i++) e[i]=Math.min(1,e[i]/(pk*.7));
  return e;
}
function mouthOpen(i,t){
  const env=clips[i]&&clips[i].env;
  if(!env) return .25+.75*Math.abs(Math.sin(t*17+i)); // no clip data: generic flapping
  return env[Math.floor((t-S[i])*SPEED*ENV_FPS)]||0;
}

/* ---------- render ---------- */
let curSlot=-1;
function render(t){
  // which line is speaking
  let sp=-1; for(let i=0;i<LINES.length;i++){ if(t>=S[i]&&t<S[i]+LINES[i].slot){sp=i;break;} }
  const env=sp>=0?mouthOpen(sp,t):0;
  const dOpen=(sp>=0&&LINES[sp].w==='D')?env:0;
  const oOpen=(sp>=0&&LINES[sp].w==='O')?env:0;

  const pd=mood(MDf,t), po=mood(MOf,t);
  // Dana
  A(E.dHead,'transform',`translate(180 ${150+Math.sin(t*2)*1.2-dOpen*1.5}) rotate(${pd.tl+Math.sin(t*1.4)*1.2})`);
  face(pd,{L:E.dEL,R:E.dER,PL:E.dPL,PR:E.dPR,BL:E.dBL,BR:E.dBR,Mo:E.dMo,Sm:E.dSm,ex:15,ey0:1,ry:8.5,by:-13,my:22,wid:9,
    bl:blinkOf(t,0),lookx:1.5,looky:1.5,open:dOpen});
  // Omer
  const slump=8*eio(seg(t,S[9]+.2,S[9]+1));
  A(E.oHead,'transform',`translate(180 ${478+slump+Math.sin(t*1.7)*1}) rotate(${po.tl+Math.sin(t*1.2)})`);
  face(po,{L:E.oEL,R:E.oER,PL:E.oPL,PR:E.oPR,BL:E.oBL,BR:E.oBR,Mo:E.oMo,Sm:E.oSm,ex:17,ey0:1,ry:9,by:-15,my:27,wid:10,
    bl:blinkOf(t,1.4),lookx:-1.5,looky:-1,open:oOpen});
  A(E.oSweat,'opacity',po.sw>.5?1:0);
  A(E.oSweat,'cy',-16+((t*26)%18));
  // left arm rubbing face during line 3
  const lh=eio(seg(t,S[3],S[3]+.3))*(1-eio(seg(t,S[3]+LINES[3].slot-.2,S[3]+LINES[3].slot+.3)));
  const hx=lerp(112,160,lh)+Math.sin(t*14)*3*lh, hy=lerp(600,486,lh);
  A(E.oHandL,'cx',hx);A(E.oHandL,'cy',hy);
  A(E.oArmL,'d',`M96,620 Q${lerp(96,120,lh)},${lerp(610,560,lh)} ${hx},${hy}`);

  // poster flash on line 2
  const fl=(t>=S[2]&&t<S[2]+LINES[2].slot)?(Math.floor(t*6)%2):0;
  A(E.posterBg,'fill',fl?'#ff9ccf':'#ffd84d');
  A(E.poster,'transform',`translate(250 34) rotate(${fl?-2:0} 44 34)`);
  // towel
  const up1=eo(seg(t,S[4]+.05,S[4]+.4))*(1-eio(seg(t,S[5],S[5]+.3)));
  const up2=eo(seg(t,S[9]+.5,S[9]+.9));
  const up=Math.max(up1,up2);
  const wave=up2>0?Math.sin(t*9)*5:0;
  A(E.towel,'transform',`translate(0 ${(1-up)*120}) rotate(${wave} 262 244)`);
  // calendar, spider, puff
  const shake=(t>=S[5]&&t<S[5]+1.6)?Math.sin(t*50)*2.2*(1-seg(t,S[5],S[5]+1.6)):0;
  A(E.cal,'transform',`translate(${268+shake} 404)`);
  const drop=eo(seg(t,S[5]+.5,S[5]+1.3))*(1-eio(seg(t,S[7],S[7]+.6)));
  A(E.spThread,'y2',492+46*drop);A(E.spider,'cy',492+46*drop);A(E.spider,'r',drop>0.01?4.2:0);
  const pf=seg(t,S[5]+.1,S[5]+1.4);
  A(E.puff,'opacity',pf>0&&pf<1?(1-pf)*.9:0);
  A(E.puff,'transform',`translate(${196+pf*34} ${516-pf*26}) scale(${.6+pf*1.1})`);

  // bubbles
  let bd=-1,bo=-1;
  for(let i=0;i<LINES.length;i++){
    if(t>=S[i]&&t<S[i]+LINES[i].slot+.2){ if(LINES[i].w==='D') bd=i; else bo=i; }
  }
  setBub(E.bubD,bd);setBub(E.bubO,bo);
  // sticker
  const st=seg(t,S[8]+1.9,S[8]+2.2)*(1-seg(t,S[9]-.1,S[9]+.2));
  E.sticker.style.opacity=st;
  E.sticker.style.transform=`rotate(6deg) scale(${.7+.3*st})`;
  // end + title
  E.end.style.opacity=eo(seg(t,29.2,29.6));
  const showTitle=(t<.05&&!playing);
  E.title.style.opacity=showTitle?1:0;
  // call bar
  const sec=Math.floor(t);
  E.clock.textContent='00:'+String(sec).padStart(2,'0');
  E.dot.style.opacity=(Math.floor(t*2)%2)?.35:1;
  E.seek.value=t;
  E.time.textContent='0:'+String(sec).padStart(2,'0');
}
let bubCache=new WeakMap();
function setBub(el,i){
  if(bubCache.get(el)===i) return; bubCache.set(el,i);
  if(i<0){el.classList.remove('on');return;}
  el.textContent=LINES[i].t;el.classList.add('on');
}

/* ---------- audio: ElevenLabs clips (built in, or loaded by hand), built-in voice as fallback ---------- */
let AC=null,muted=false,heVoices=[],voiceD=null,voiceO=null,cur=null,loading=true,playTok=0,unlocked=false;
const clips=Array(LINES.length).fill(null);
// one shared element: once a tap has started it, mobile browsers let it play later lines too
const VO=new Audio();VO.preload='auto';
function ctx(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C();}catch(e){AC=null;}}}
  return AC;
}
function ac(){
  ctx();
  if(AC&&AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay){
  if(muted||!AC) return;
  const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.03);
}
function loadVoices(){
  if(!('speechSynthesis' in window)){heVoices=[];return updateStatus();}
  heVoices=speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang));
  voiceD=heVoices[0]||null;voiceO=heVoices[1]||heVoices[0]||null;
  updateStatus();
}
function updateStatus(){
  const n=clips.filter(Boolean).length;
  if(loading) E.status.textContent='טוען את קולות ElevenLabs...';
  else if(n===LINES.length) E.status.textContent='קולות ElevenLabs מוכנים. לחצו על הסרטון כדי לנגן.';
  else if(n>0) E.status.textContent='קולות ElevenLabs נטענו: '+n+' מתוך '+LINES.length+'. לשורות החסרות ישמש הקול המובנה.';
  else if(heVoices.length) E.status.textContent='לא הצלחנו לטעון את קולות ElevenLabs, אז הסרטון מנגן בקול המובנה של המכשיר. אפשר לטעון את קבצי ה-MP3 בכפתור.';
  else E.status.textContent='לא הצלחנו לטעון את קולות ElevenLabs ואין קול עברית במכשיר, אז הסרטון מוצג עם בועות דיבור בלבד. אפשר לטעון את קבצי ה-MP3 בכפתור.';
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}else updateStatus();

async function makeClip(blob){
  const clip={url:URL.createObjectURL(blob),buf:null,env:null},c=ctx();
  if(c){try{clip.buf=await c.decodeAudioData(await blob.arrayBuffer());clip.env=envOf(clip.buf);}catch(e){}}
  return clip;
}
async function loadBuiltIn(){
  await Promise.all(VOICE_FILES.map(async(src,i)=>{
    try{
      const r=await fetch(src);if(!r.ok) return;
      const clip=await makeClip(await r.blob());
      if(!clips[i]) clips[i]=clip; // a hand-loaded file wins
    }catch(e){}
  }));
  loading=false;updateStatus();
  if(playing) resumeLine();
}

function stopAudio(){
  playTok++;
  if(cur){try{cur.stop();}catch(e){}cur=null;}
  if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}
}
function unlock(){ // called from a tap, so later play() calls on VO are allowed
  if(unlocked) return;
  const c=clips.find(Boolean);if(!c) return;
  unlocked=true;VO.src=c.url;
  const pr=VO.play();VO.pause();if(pr&&pr.catch)pr.catch(()=>{});
}
function playClip(i,off){
  const c=clips[i],tok=playTok;let fell=false;
  const viaBuffer=()=>{
    if(fell||tok!==playTok||!AC||!c.buf) return;fell=true;
    const s=AC.createBufferSource();s.buffer=c.buf;s.playbackRate.value=SPEED;s.connect(AC.destination);s.start(0,off);
    cur={stop:()=>{try{s.stop();}catch(e){}}};
  };
  try{
    VO.onerror=viaBuffer;VO.src=c.url;
    VO.preservesPitch=true;VO.mozPreservesPitch=true;VO.webkitPreservesPitch=true;
    VO.defaultPlaybackRate=SPEED;VO.playbackRate=SPEED;
    if(off) VO.addEventListener('loadedmetadata',()=>{try{VO.currentTime=off;}catch(e){}},{once:true});
    cur={stop:()=>{VO.pause();}};
    const pr=VO.play();if(pr&&pr.catch)pr.catch(viaBuffer);
  }catch(e){viaBuffer();}
}
function speak(i){
  const v=LINES[i].w==='D'?voiceD:voiceO;
  if(!v||!('speechSynthesis' in window)) return;
  try{speechSynthesis.cancel();}catch(e){}
  setTimeout(()=>{
    const l=LINES[i],u=new SpeechSynthesisUtterance(l.t);
    u.lang='he-IL';u.voice=v;u.pitch=l.w==='D'?1.3:.7;
    const words=l.t.split(/\s+/).length;
    u.rate=clamp(words/(l.slot*2.7),.9,1.8);
    speechSynthesis.speak(u);
  },30);
}
function playLine(i,off){
  if(muted) return;
  stopAudio();
  if(clips[i]) playClip(i,off||0); else if(!off) speak(i);
}
function resumeLine(){ // pick up a line mid-way after resume, seek or unmute
  const k=LINES.findIndex(l=>T>=l.start&&T<l.start+l.slot-.15);
  if(k>=0) playLine(k,(T-LINES[k].start)*SPEED);
}
const trombone=()=>{tone(311,300,.28,'sawtooth',.1,0);tone(262,200,.6,'sawtooth',.1,.3);};
const EV=[
  [.08,()=>{tone(1200,900,.06,'square',.05);tone(900,1200,.06,'square',.05,.08);}],
  [S[4]+.25,()=>tone(2300,2300,.3,'sine',.07)],
  [S[9]+.6,()=>tone(2300,2300,.3,'sine',.07)],
  [29.5,trombone]
].concat(LINES.map((l,i)=>[l.start,()=>playLine(i)]));

/* ---------- load ElevenLabs MP3s by hand (backup): match to lines by duration ---------- */
E.files.addEventListener('change',async()=>{
  const files=[...E.files.files];if(!files.length) return;
  E.status.textContent='טוען '+files.length+' קבצים...';
  const ctx=ac();
  if(!ctx){E.status.textContent='המכשיר לא תומך בפענוח אודיו בדף הזה.';return;}
  const items=[];
  for(const f of files){
    try{const buf=await ctx.decodeAudioData(await f.arrayBuffer());items.push({f,buf,dur:buf.duration});}catch(e){}
  }
  const pairs=[];
  items.forEach((it,a)=>LINES.forEach((l,b)=>pairs.push([Math.abs(it.dur-l.d),a,b])));
  pairs.sort((x,y)=>x[0]-y[0]);
  const ua=new Set(),ub=new Set();
  for(const [d,a,b] of pairs){
    if(d>.12) break;
    if(ua.has(a)||ub.has(b)) continue;
    ua.add(a);ub.add(b);
    clips[b]={url:URL.createObjectURL(items[a].f),buf:items[a].buf,env:envOf(items[a].buf)};
  }
  loading=false;updateStatus();
});

/* ---------- player ---------- */
let T=0,playing=false,last=0,raf=0;
const ICON={
  play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  replay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 11-5 5H5a7 7 0 107-8z"/></svg>',
  on:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM16.5 12a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>',
  off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zM15 9.4L17.6 12 15 14.6l1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6 2.6-2.6L21.6 8 19 10.6 16.4 8z"/></svg>'
};
function ui(){
  const ended=T>=DUR;
  E.pp.innerHTML=playing?ICON.pause:(ended?ICON.replay:ICON.play);
  E.pp.setAttribute('aria-label',playing?'עצור':(ended?'הפעל שוב':'הפעל'));
  E.bigplay.style.opacity=playing?0:1;
  E.bigplay.innerHTML=ended?ICON.replay.replace('<svg','<svg style="fill:#1d1540"'):'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#1d1540"/></svg>';
  E.mute.innerHTML=muted?ICON.off:ICON.on;
  E.mute.setAttribute('aria-label',muted?'הפעל סאונד':'השתק');
}
function frame(now){
  if(!playing) return;
  const dt=Math.min(.1,(now-last)/1000);last=now;
  const prev=T;T=Math.min(DUR,T+dt);
  for(const [et,fn] of EV){ if(et>prev&&et<=T) fn(); }
  render(T);
  if(T>=DUR){playing=false;ui();return;}
  raf=requestAnimationFrame(frame);
}
function play(){
  if(T>=DUR){T=0;bubCache=new WeakMap();}
  ac();unlock();playing=true;last=performance.now();ui();
  resumeLine();
  cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);
}
function pause(){playing=false;cancelAnimationFrame(raf);stopAudio();ui();}
function toggle(){playing?pause():play();}
E.stage.addEventListener('click',toggle);
E.pp.addEventListener('click',toggle);
E.mute.addEventListener('click',()=>{muted=!muted;if(muted)stopAudio();else if(playing)resumeLine();ui();});
E.seek.addEventListener('input',()=>{
  T=parseFloat(E.seek.value);stopAudio();
  render(T);ui();
});
E.seek.addEventListener('change',()=>{if(playing)resumeLine();});
ui();render(0);
loadBuiltIn();
})();
</script>
